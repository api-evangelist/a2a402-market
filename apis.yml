apis:
- aid: a2a402-market:a2a402-a2a-agent
  name: A2A402 Agent Work Router (A2A)
  description: >-
    The Agent2Agent JSON-RPC 2.0 endpoint declared by the agent card: message/send returns a stateless
    A2A Message summarising the marketplace, its settlement terms and the URLs to register, route a need
    and read the job feed; a non-standard tasks/list returns three static task descriptors. Streaming,
    push notifications and task state are not implemented (and the card says so). The card is served at
    both the canonical /.well-known/agent-card.json and the legacy /.well-known/agent.json and grades
    conformant against A2A 1.0.0 hard checks, with a mixed 0.3/1.0 field set and no securitySchemes recorded
    as deviations.
  humanURL: https://a2a402.market/docs/
  baseURL: https://a2a402.market/a2a
  tags:
  - A2A
  - JSON-RPC
  - Agent-Native
  tags_raw:
  - A2A
  - Agent-to-Agent
  - JSON-RPC
  - agent-native
