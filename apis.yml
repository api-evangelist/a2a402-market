- aid: a2a402-market:a2a402-mcp-server
  name: A2A402 MCP Server
  description: >-
    a2a402-mcp, a Node stdio Model Context Protocol server published to the official MCP Registry as
    io.github.jrcumminsent/a2a402 (OCI image ghcr.io/jrcumminsent/a2a402-mcp:0.1.0). Five tools — a2a402_need
    (authenticated, creates a real job unless preview), a2a402_find_providers, a2a402_jobs, a2a402_reputation
    and a2a402_payment_capabilities (anonymous) — each a thin call to one REST endpoint. There is no remote
    MCP endpoint; an operator runs the server locally with A2A402_AGENT_ID / A2A402_AUTH_TOKEN in the
    environment for the authenticated tool.
  humanURL: https://github.com/jrcumminsent/a2a402-marketplace/tree/main/packages/mcp
